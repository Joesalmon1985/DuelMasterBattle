[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-generation-factory"
version = "0.2.0"
description = "Offline dialogue generation factory for Duel Master Battle"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["dialogue_generation", "dialogue_generation.prompts"]

[tool.setuptools.package-dir]
"dialogue_generation" = "."

[tool.setuptools.package-data]
dialogue_generation = ["worldviews.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
